name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use fixed signing key
        run: |
          base64 -d debug.keystore.b64 > android/app/fixed.keystore
          mkdir -p ~/.android
          cp android/app/fixed.keystore ~/.android/debug.keystore
          if [ -f android/app/build.gradle ]; then
            sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file("fixed.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
            grep -q signingConfigs android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("fixed.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          }
          EOF
          else
            echo "No Android build file found"; exit 1
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Check the signing key is the permanent one
        run: |
          WANT=$(keytool -list -v -keystore android/app/fixed.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          GOT=$("${BT}apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*digest: *//' | tr 'A-F' 'a-f')
          echo "want: $WANT"
          echo "got:  $GOT"
          test -n "$WANT" && test "$WANT" = "$GOT"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PowerPay.apk
          gh release create "build-${{ github.run_number }}" PowerPay.apk --title "PowerPay build ${{ github.run_number }}" --notes "Debug APK"
